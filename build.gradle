import java.time.Duration

plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'gps.ShortestPathPluginTest'

dependencies {
    compileOnly "net.runelite:client:$runeLiteVersion"

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:3.4.6'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation "net.runelite:client:$runeLiteVersion"
    testImplementation "net.runelite:jshell:$runeLiteVersion"
    testImplementation("net.runelite:cache:$runeLiteVersion") {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }

}

group = 'gps'

// Bundle the plugin manifest onto the classpath so the plugin can read its own version at runtime
// (the "report an issue" context). Harmless for the hub, which reads the repo-root copy for metadata.
processResources {
    from('runelite-plugin.properties')
    // Stamp the build's git commit so debug snapshots, "Report an issue" and the audit tool
    // can say exactly what code produced them. 'unknown' when git is unavailable.
    def gitCommit = 'unknown'
    try {
        def proc = 'git rev-parse --short HEAD'.execute(null, projectDir)
        proc.waitFor()
        if (proc.exitValue() == 0) {
            gitCommit = proc.text.trim()
        }
    } catch (Exception ignored) {
    }
    def commitValue = gitCommit
    // Task INPUT, not just doLast side effect: without this, a Java-only commit leaves
    // processResources UP-TO-DATE and the stamp freezes at whatever commit last touched a
    // resource file — the stamp then lies about what code is running.
    inputs.property('gitCommit', commitValue)
    doLast {
        new File(destinationDir, 'gps-build.properties').text = "commit=${commitValue}\n"
    }
}


// Toolchain pin removed: requires a JDK 11 install. The JavaCompile config below already sets
// options.release = 11 and source/targetCompatibility = 11, so any JDK 11+ (e.g. 21) still produces
// Java 11 bytecode. To restore strict pinning, re-add:
//   java { toolchain { languageVersion.set(JavaLanguageVersion.of(11)) } }
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(Checkstyle).configureEach {
    enabled = true
    ignoreFailures = false
}

// --- Testing ---

test {
    // One fork per two cores: the suite is ~28 full route generations plus world-scale floods,
    // all CPU-bound and independent; each fork re-pays the one-time data load, so don't over-shard.
    maxParallelForks = Math.max(1, (Runtime.runtime.availableProcessors() / 2) as int)
    jvmArgs = ['-Xms1g', '-Xmx4g']
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
    // A hung generation latch used to block the build indefinitely.
    timeout = Duration.ofMinutes(20)
    // Gated probes and dev data tools read -D flags; forward the recognised families. A probe
    // run also shows the tests' standard output: the probes report as BENCH/PROBE lines on
    // stdout, which the default logging hides (they only ever reached the XML and HTML reports).
    // Scope probe runs with --tests, or the whole suite's output comes along.
    boolean probeRun = false
    System.properties.each { key, value ->
        String k = key.toString()
        if (k ==~ /^(gps|wikiLocations|collisionDiff|floors)\..*/
            || k in ['altarProbe', 'keldaProbe', 'karuulmPipeProbe', 'snapReport', 'snapFix', 'kebosMineProbe']) {
            systemProperty k, value
            probeRun = true
        }
    }
    testLogging.showStandardStreams = probeRun
}

jacoco {
    toolVersion = "0.8.11"
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml')
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/test/html')
    }
}

// The dev transport audit lives in TEST sources (never in the hub jar). This outgoing variant
// hands its classes to the dev-launcher composite build — attribute-matched because Gradle's
// dependency substitution can't resolve classifier artifacts across included builds.
def devAuditAttribute = Attribute.of('dev.audit.bundle', String)
tasks.register('devAuditJar', Jar) {
    dependsOn compileTestJava, processTestResources
    archiveClassifier = 'dev-audit'
    from sourceSets.test.output
    include 'gps/dev/**'
}
configurations {
    devAuditElements {
        canBeConsumed = true
        canBeResolved = false
        attributes {
            attribute(devAuditAttribute, 'true')
        }
    }
}
artifacts {
    devAuditElements devAuditJar
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    // --add-opens matches RuneLite's own launcher: on JDK 17+ ReflectUtil's annotation-cache
    // invalidation needs java.lang.reflect opened, else every dev launch logs an
    // InaccessibleObjectException (harmless but alarming).
    jvmArgs "-ea", "-da:net.runelite.client.plugins.gpu...", "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED"
    args "--developer-mode", "--debug"
}

// Dev client WITH the transport audit tooling (scene flags, capture, builder panel).
// Off by default in `run` so normal play-testing isn't crowded by audit highlights.
tasks.register('runAudit', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    jvmArgs "-ea", "-da:net.runelite.client.plugins.gpu...", "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED", "-Dgps.audit=true"
    args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
    dependsOn configurations.testRuntimeClasspath
    manifest {
        attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from sourceSets.test.output
    from {
        configurations.testRuntimeClasspath.collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }
    exclude 'META-INF/INDEX.LIST'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude '**/module-info.class'
    group = BasePlugin.BUILD_GROUP
    archiveClassifier.set('shadow')
    archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

// --- JMH microbenchmarks (dev-only, opt-in) ---
// Gated behind -Pjmh so the default build — including the plugin hub's — never defines the source
// set, resolves jmh-core, or compiles src/jmh (which also keeps it off the hub's review surface).
// The benchmarks reuse the test fixtures (TestPathfinderConfig loads the real collision map +
// transports) via the test output.
// Run e.g.:  ./gradlew -Pjmh jmh --args='DistanceFieldBenchmark -f 1 -wi 3 -i 5'
if (project.hasProperty('jmh')) {
    sourceSets {
        jmh {
            java.srcDir 'src/jmh/java'
        }
    }

    configurations {
        jmhImplementation.extendsFrom testImplementation
    }

    dependencies {
        jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
        jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
        jmhImplementation 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
        jmhImplementation sourceSets.main.output
        jmhImplementation sourceSets.test.output
    }

    tasks.matching { it.name == 'checkstyleJmh' }.configureEach { enabled = false }

    tasks.register('jmh', JavaExec) {
        group = 'benchmark'
        description = 'Run JMH microbenchmarks (dev-only; enable with -Pjmh).'
        mainClass = 'org.openjdk.jmh.Main'
        classpath = sourceSets.jmh.runtimeClasspath
    }
} else {
    // The task exists without the property too, so a bare `./gradlew jmh --args=...` explains the
    // gate instead of failing with "Task 'jmh' not found". A JavaExec so that --args parses.
    tasks.register('jmh', JavaExec) {
        group = 'benchmark'
        description = 'Run JMH microbenchmarks (dev-only; enable with -Pjmh).'
        mainClass = 'org.openjdk.jmh.Main'
        classpath = files()
        doFirst {
            throw new GradleException("The JMH benchmarks are gated behind -Pjmh: "
                + "./gradlew -Pjmh jmh --args='GenerateBenchmark'")
        }
    }
}



